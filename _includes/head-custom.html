<!-- Jekyll theme hook (pages-themes/primer): renders the docs' mermaid fences as diagrams.
     Kramdown emits a mermaid fence as a plain code block; github.com renders the same fence natively. -->
<style>
  pre.mermaid { background: transparent; text-align: center; }
</style>
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";

  const nodes = [];
  document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach(block => {
    const target = block.tagName === "CODE" ? block.parentElement : block;
    const diagram = document.createElement("pre");
    diagram.className = "mermaid";
    diagram.textContent = block.textContent;
    target.replaceWith(diagram);
    nodes.push(diagram);
  });
  if (nodes.length > 0) {
    mermaid.initialize({ startOnLoad: false });
    await mermaid.run({ nodes });
  }
</script>
